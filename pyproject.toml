[project]
name = "sustainable-open-contracting-org"
version = "0.0.0"
requires-python = ">=3.12"

[dependency-groups]
screenshots = ["playwright", "pillow"]

[tool.ruff]
line-length = 119

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN", "C901", "COM812", "CPY001", "D203", "D212", "D415", "EM", "ISC001", "PERF203", "PLR091", "Q000",
    "D1",
]

[tool.ruff.lint.flake8-builtins]
builtins-ignorelist = ["copyright"]

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true

# To override the shared lint workflow.
[tool.ruff.lint.extend-per-file-ignores]
"scripts/*" = ["INP001", "T201"]  # implicit-namespace-package, print

[tool.pymarkdown]
extensions.front-matter.enabled = true

# No br-spaces.
plugins.md009.strict = true
# Single-line paragraphs.
plugins.md013.enabled = false
# The page title is in front matter.
plugins.md041.enabled = false
# Decorative illustrations have empty alt text.
plugins.md045.enabled = false
# Local style.
plugins.md049.style = "asterisk"

# https://github.com/open-contracting-partnership/sustainable.open-contracting.org/issues/27
plugins.md001.enabled = false # heading-increment
plugins.md025.enabled = false # single-title
plugins.md036.enabled = false # no-emphasis-as-heading
