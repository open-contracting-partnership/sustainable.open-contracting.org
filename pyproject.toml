[project]
name = "sustainable-open-contracting-org"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
screenshots = ["playwright", "pillow"]

[tool.ruff]
line-length = 119

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN", "C901", "COM812", "CPY001", "D203", "D212", "D415", "EM", "ISC001", "PERF203", "PLR091", "Q000",
    "D1",
]

[tool.ruff.lint.flake8-builtins]
builtins-ignorelist = ["copyright"]

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true

# extend-per-file-ignores, since the shared lint workflow sets per-file-ignores on the command line.
[tool.ruff.lint.extend-per-file-ignores]
# The scripts print their results, and aren't a package.
"scripts/*" = ["INP001", "T201"]

# pymarkdownlnt's configuration, for the pages and the README.
[tool.pymarkdown]
# Otherwise, the front matter reads as headings.
extensions.front-matter.enabled = true
# A paragraph is one line.
plugins.md013.enabled = false
# The page's title is in its front matter.
plugins.md041.enabled = false
# Notion's bold paragraphs.
plugins.md036.enabled = false
# A line break is a newline, not two trailing spaces.
plugins.md009.br_spaces = 0
# <br> is a line break in a table cell, or an empty line in Notion's text.
plugins.md033.allowed_elements = "br"
# Headings are at Notion's levels: the title and "#" headings are <h1>, and some levels are skipped (see #17).
plugins.md001.enabled = false
plugins.md025.enabled = false
plugins.md049.style = "asterisk"
