# Build one site at a time, e.g.: bundle exec jekyll serve --config _config.yml,_config.en.yml
include: [_headers, _redirects]
favicon: /assets/images/favicon.png
# Fail the build on invalid front matter, and on Liquid syntax errors and unknown filters.
strict_front_matter: true
liquid:
  error_mode: strict
  strict_filters: true
defaults:
  - scope:
      path: ""
    values:
      layout: default
# Database items' properties whose values are dates and URLs, for the {% properties %} tag.
notion:
  date_properties: [Created]
  url_properties: ["super:Link"]
# Output text as written: no heading IDs, curly quotes or typographic symbols.
kramdown:
  auto_ids: false
  smart_quotes: apos,apos,quot,quot
  typographic_symbols:
    hellip: "..."
    mdash: "---"
    ndash: "--"
    laquo: "<<"
    raquo: ">>"
    laquo_space: "<< "
    raquo_space: " >>"
# The sidebar's fraction of the width of pages with "sidebar: true".
sidebar_width: 0.25
# Each language's config sets breadcrumb_label, the label of the button that shows the breadcrumbs that don't fit,
# and sidebar_label, the label of the sidebar's navigation.
